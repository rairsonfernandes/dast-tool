    <!-- CSS MINIFICADO (tudo numa linha) -->
    <style>:root{--bg-primary:#0a0b0f;--bg-secondary:#12141a;--bg-elevated:#171a22;--text-primary:#eef1f6;--text-secondary:#a8b0bd;--text-muted:#6b7280;--accent:#00d97e;--accent-hover:#00f08b;--accent-glow:rgba(0,217,126,0.18);--accent-soft:rgba(0,217,126,0.08);--border-subtle:rgba(255,255,255,0.06);--border-strong:rgba(255,255,255,0.12);--font-sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--font-display:'Space Grotesk','Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono','SF Mono','Fira Code',ui-monospace,monospace;--space-xs:.5rem;--space-sm:.75rem;--space-md:1rem;--space-lg:1.5rem;--space-xl:2.5rem;--space-2xl:4rem;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;--ease-smooth:cubic-bezier(0.4,0,0.2,1);--ease-breath:cubic-bezier(0.45,0,0.55,1);--dur-fast:150ms;--dur-base:300ms;--dur-slow:2400ms}*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse 80% 50% at 50% -10%,#14161d 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 50% 110%,#0d1017 0%,transparent 55%),var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);font-size:16px;line-height:1.6;font-feature-settings:'cv11','ss01';font-variant-ligatures:contextual;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}#root:empty{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;flex-direction:column;gap:var(--space-xl);padding:var(--space-xl);text-align:center}#root:empty::before{content:'SENTINEL';display:block;font-family:var(--font-mono);font-size:clamp(1.25rem,4vw,1.75rem);font-weight:600;letter-spacing:.6em;padding-left:.6em;color:var(--accent);text-shadow:0 0 12px var(--accent-glow),0 0 40px rgba(0,217,126,.25),0 0 80px rgba(0,217,126,.1);animation:brandBreath var(--dur-slow) var(--ease-breath) infinite}#root:empty::after{content:'';display:block;width:120px;height:2px;border-radius:var(--radius-full);background:linear-gradient(90deg,transparent 0%,var(--accent) 50%,transparent 100%);box-shadow:0 0 16px var(--accent-glow);opacity:.8;animation:barSlide 2.4s var(--ease-smooth) infinite,barPulse 2.4s var(--ease-breath) infinite}@keyframes brandBreath{0%,100%{opacity:.9;filter:brightness(1);transform:scale(1)}50%{opacity:.45;filter:brightness(.85);transform:scale(.985)}}@keyframes barSlide{0%{transform:translateX(-60px)}50%{transform:translateX(0)}100%{transform:translateX(60px)}}@keyframes barPulse{0%,100%{width:80px;opacity:.9}50%{width:140px;opacity:.5}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#root:empty::before,#root:empty::after{animation:none;opacity:.9}}::selection{background:var(--accent-soft);color:var(--accent)}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg-primary)}::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:var(--radius-full);border:2px solid var(--bg-primary)}::-webkit-scrollbar-thumb:hover{background:#232734}:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--radius-sm)}#sys-status-badge{position:fixed;bottom:24px;right:24px;z-index:9999;font-family:var(--font-mono);font-size:11px;font-weight:700;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,11,15,.9);border:1px solid var(--border-strong);border-radius:100px;color:var(--text-primary);backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.5);transition:all .3s ease}#sys-status-badge .dot{width:8px;height:8px;border-radius:50%;background:#FFC107;animation:pulse 1.5s infinite}#sys-status-badge.online .dot{background:#00FF66}#sys-status-badge.offline .dot{background:#FF2E54}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}</style>

  <body>
    <div id="root"></div>

    <!-- Badge de Status -->
    <div id="sys-status-badge">
      <span class="dot"></span>
      <span class="text">A VERIFICAR...</span>
    </div>

    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;font-family:'Inter',system-ui,sans-serif;text-align:center;color:#eef1f6;background:#0a0b0f;">
        <div style="max-width:420px;">
          <div style="font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;letter-spacing:.5em;padding-left:.5em;color:#00d97e;margin-bottom:1.5rem;">SENTINEL</div>
          <h1 style="font-size:1.25rem;font-weight:600;margin:0 0 .75rem;">JavaScript está desativado</h1>
          <p style="color:#a8b0bd;font-size:1rem;margin:0 0 .5rem;line-height:1.6;">Precisas de ativar o JavaScript para usar esta plataforma.</p>
          <p style="color:#6b7280;font-size:.875rem;margin:0;line-height:1.6;">Ativa o JavaScript nas definições do teu navegador e recarrega a página.</p>
        </div>
      </div>
    </noscript>

    <!-- Script do Status -->
    <script>
      !function(){var e="https://dast-tool-backend.onrender.com/health",t=document.getElementById("sys-status-badge"),n=t.querySelector(".text"),o=function(){fetch(e,{method:"GET"}).then(function(e){if(e.ok)return e.json();throw new Error}).then(function(e){t.className="online",n.textContent="SISTEMA ONLINE"}).catch(function(){t.className="offline",n.textContent="SISTEMA OFFLINE"})};o(),setInterval(o,6e4)}()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
